apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: librachieve
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: librachieve-frontend:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: librachieve
spec:
  selector: { app: frontend }
  ports: [{ port: 80 }]
---
# Requires: minikube addons enable ingress   +   "<minikube ip> librachieve.local" in hosts file
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: librachieve
  namespace: librachieve
spec:
  ingressClassName: nginx
  rules:
    - host: librachieve.local
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: backend, port: { number: 8000 } } } }
          - { path: /graphql, pathType: Prefix, backend: { service: { name: backend, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 80 } } } }
