# cp infra/k8s-secret.example.yaml infra/k8s/secret.yaml (git-ignored), fill in, then apply infra/k8s/
apiVersion: v1
kind: Secret
metadata:
  name: librachieve-secrets
  namespace: librachieve
type: Opaque
stringData:
  SECRET_KEY: change-me
  POSTGRES_PASSWORD: change-me
  DATABASE_URL: postgresql+asyncpg://librachieve:change-me@postgres:5432/librachieve
  STEAM_API_KEY: ""
  IGDB_CLIENT_ID: ""
  IGDB_CLIENT_SECRET: ""
