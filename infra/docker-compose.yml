# Dev stack. From the repo root:  docker compose -f infra/docker-compose.yml up --build
name: librachieve

x-backend: &backend
  build:
    context: ..
    dockerfile: backend/Dockerfile
    args:
      INSTALL_DEV: "true"
  env_file:
    - path: ../.env
      required: false
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-librachieve}:${POSTGRES_PASSWORD:-librachieve}@postgres:5432/${POSTGRES_DB:-librachieve}
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ../backend/app:/app/app
    - ../backend/tests:/app/tests
    - ../backend/pyproject.toml:/app/pyproject.toml
    - ../migrations:/app/migrations
    - ../alembic.ini:/app/alembic.ini
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-librachieve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-librachieve}
      POSTGRES_DB: ${POSTGRES_DB:-librachieve}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  backend:
    <<: *backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: arq app.worker.WorkerSettings --watch app

  frontend:
    build:
      context: ../frontend
      target: dev
    environment:
      VITE_API_PROXY: http://backend:8000
      VITE_USE_POLLING: "1"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
