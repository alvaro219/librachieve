# Deploys main to the production VM (Oracle Cloud) after CI passes.
# Repository settings > Secrets and variables > Actions:
#   variables: DEPLOY_HOST (server IP or hostname), DEPLOY_USER (e.g. ubuntu)
#   secrets:   DEPLOY_SSH_KEY (private key whose public half is in the server's authorized_keys)
# The server holds the repo at ~/librachieve with its production .env (see infra/README.md).
# Skipped entirely while DEPLOY_HOST is not set.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-production

jobs:
  deploy:
    if: ${{ vars.DEPLOY_HOST != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" bash -s <<EOF
          set -euo pipefail
          cd ~/librachieve
          git fetch --depth 1 origin "$SHA"
          git checkout --force FETCH_HEAD
          docker compose -f infra/docker-compose.prod.yml --env-file .env up -d --build --remove-orphans
          docker image prune -f
          EOF
          rm -f key
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            curl -fsS "https://${{ vars.DEPLOY_DOMAIN || vars.DEPLOY_HOST }}/api/health" && exit 0
            sleep 5
          done
          echo "Health check failed" && exit 1
