<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <title>Librachieve</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #020617; color: #f1f5f9; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 96px; height: 96px; border-radius: 20px; }
      h1 { font-size: 1.4rem; margin: 20px 0 8px; }
      p { color: #94a3b8; margin: 0 0 24px; line-height: 1.5; max-width: 26rem; }
      button { font: inherit; font-weight: 500; color: #fff; background: #4f46e5; border: 0; border-radius: 8px; padding: 10px 20px; cursor: pointer; }
      button:hover { background: #6366f1; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1 id="title">Sin conexión</h1>
      <p id="text">Librachieve necesita internet para cargar tu biblioteca. Comprueba la conexión y vuelve a intentarlo.</p>
      <button id="retry" onclick="location.reload()">Reintentar</button>
    </main>
    <script>
      // Same choice as the app (saved by i18next), else the browser language
      var TEXTS = {
        es: ["Sin conexión", "Librachieve necesita internet para cargar tu biblioteca. Comprueba la conexión y vuelve a intentarlo.", "Reintentar"],
        en: ["You're offline", "Librachieve needs an internet connection to load your library. Check your connection and try again.", "Try again"],
        fr: ["Hors ligne", "Librachieve a besoin d’internet pour charger ta bibliothèque. Vérifie ta connexion et réessaie.", "Réessayer"],
      };
      var lang = "en";
      try { lang = (localStorage.getItem("lang") || navigator.language || "en").slice(0, 2); } catch (e) {}
      var t = TEXTS[lang] || TEXTS.en;
      document.documentElement.lang = TEXTS[lang] ? lang : "en";
      document.title = t[0] + " · Librachieve";
      document.getElementById("title").textContent = t[0];
      document.getElementById("text").textContent = t[1];
      document.getElementById("retry").textContent = t[2];
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
